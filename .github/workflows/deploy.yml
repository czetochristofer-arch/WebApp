# Pri každom pushnutí do vetvy main sa aplikácia zostaví a nasadí na Firebase
# (hosting, databázové pravidlá, indexy, pravidlá úložiska a serverové funkcie).
name: Nasadenie na Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT || 'chrisstop-app' }}
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Chýba prístup k Firebase
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::warning::Tajomstvo FIREBASE_SERVICE_ACCOUNT ešte nie je nastavené – aplikácia sa zostaví, ale nenasadí. Postup je v README (scripts/cloud-setup.sh)."

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Inštalácia závislostí
        run: |
          npm ci
          npm ci --prefix functions

      - name: Kontrola a build
        run: |
          npm run build
          npm run build --prefix functions

      - name: Prihlásenie do Google Cloud
        if: env.HAS_CREDENTIALS == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Web, databáza a úložisko sa nasadia samostatne, aby aplikácia bežala aj vtedy,
      # keď by mali problém serverové funkcie. Chybové hlásenia sa zapíšu ako anotácie behu.
      - name: Nasadenie – web, databáza, úložisko
        id: web
        if: env.HAS_CREDENTIALS == 'true'
        run: |
          set -o pipefail
          npx firebase deploy --only hosting,firestore,storage --project "$FIREBASE_PROJECT" --non-interactive --force 2>&1 | tee deploy-web.log || {
            grep -iE "error|denied|permission|not enabled|billing|failed|must" deploy-web.log | grep -v "^i " | head -12 | sed 's/^/::error title=web::/'
            exit 1
          }

      - name: Nasadenie – serverové funkcie a AI asistent
        if: env.HAS_CREDENTIALS == 'true' && !cancelled()
        run: |
          set -o pipefail
          npx firebase deploy --only functions --project "$FIREBASE_PROJECT" --non-interactive --force 2>&1 | tee deploy-functions.log || {
            grep -iE "error|denied|permission|not enabled|billing|failed|must" deploy-functions.log | grep -v "^i " | head -12 | sed 's/^/::error title=functions::/'
            [ -f firebase-debug.log ] && grep -iE "\"message\"|error" firebase-debug.log | tail -6 | cut -c1-400 | sed 's/^/::error title=debug::/'
            exit 1
          }
